<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 치료적 의사소통 연습</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;color:#243044}main{max-width:760px;margin:35px auto;padding:20px}section{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #1a31500d}h1{font-size:25px}select,textarea,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #cbd5e1}select{width:100%}textarea{box-sizing:border-box;width:100%;min-height:85px;margin-top:15px}button{background:#2563eb;color:white;border:0;cursor:pointer;margin-top:8px}.bubble{padding:13px;border-radius:12px;margin:13px 0;line-height:1.6}.patient{background:#eef2f7;margin-right:12%}.student{background:#dbeafe;margin-left:12%}.hint{color:#64748b;font-size:14px}#feedback{white-space:pre-line;background:#f0fdf4;padding:14px;border-radius:10px;margin-top:15px;display:none}</style></head><body><main><h1>AI 치료적 의사소통 연습</h1><p class="hint">간호대학생을 위한 가상 환자 대화 시뮬레이션 · 1차 체험판</p><section><label for="scenario">시나리오 선택</label><select id="scenario"><option value="ostomy">장루 형성 예정 환자</option><option value="pregnancy">반복 유산 경험이 있는 임산부</option></select><div id="chat" aria-live="polite"></div><textarea id="answer" placeholder="환자에게 어떤 말을 건네시겠습니까?"></textarea><button id="send">답변 전송</button><button id="restart" style="background:#64748b">다시 시작</button><div id="feedback"></div></section><p class="hint">안내: 이 버전은 실제 AI가 아닌 미리 작성된 환자 반응을 사용합니다. 실제 환자정보를 입력하지 마세요.</p></main><script>const cases={ostomy:{opening:'수술하면 살 수 있다고는 하는데, 장루를 달고 어떻게 사람들을 만나겠어요. 너무 창피할 것 같아요.',responses:['사람들이 저를 이상하게 볼까 봐 걱정돼요. 예전처럼 밖에 나갈 수 있을까요?','제 마음을 들어주셔서 고맙습니다. 그래도 아직 두려워요.']},pregnancy:{opening:'전에 두 번이나 유산했어요. 이번에도 아기를 잃을까 봐 매일 무서워요.',responses:['조금만 배가 불편해도 또 잘못된 건 아닐까 불안해요.','제 이야기를 들어주셔서 감사해요. 아직 걱정되지만 조금은 마음이 놓여요.']}};let turn=0;const chat=document.getElementById('chat'),answer=document.getElementById('answer'),feedback=document.getElementById('feedback'),scenario=document.getElementById('scenario');function bubble(role,message){const d=document.createElement('div');d.className='bubble '+role;const strong=document.createElement('strong');strong.textContent=role==='patient'?'환자: ':'학생: ';d.append(strong,document.createTextNode(message));chat.append(d)}function start(){turn=0;chat.replaceChildren();feedback.style.display='none';answer.value='';answer.disabled=false;document.getElementById('send').disabled=false;bubble('patient',cases[scenario.value].opening)}function send(){const message=answer.value.trim();if(!message)return;bubble('student',message);answer.value='';bubble('patient',cases[scenario.value].responses[turn]);turn++;if(turn===2){answer.disabled=true;document.getElementById('send').disabled=true;feedback.style.display='block';feedback.textContent='연습이 종료되었습니다.\n스스로 점검해 보세요: 환자의 감정을 인정했나요? 판단하거나 섣불리 안심시키지 않았나요? 환자가 자신의 감정을 더 표현하도록 도왔나요?\n※ 이 피드백은 자동 채점이 아닌 자기점검 문항입니다.'}}document.getElementById('send').addEventListener('click',send);document.getElementById('restart').addEventListener('click',start);scenario.addEventListener('change',start);start();</script></body></html>
